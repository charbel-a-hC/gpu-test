[project]
name = "gpu-test"
version = "2.0.0"
description = "Production-grade GPU benchmark & stress testing kit — CUDA 13.0+"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "torch>=2.9.0",
    "nvidia-ml-py>=12.0.0",
]

[project.scripts]
gpu-test = "gpu_test.__main__:main"

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu130"]
